services:
  nginx:
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./letsencrypt:/etc/letsencrypt:ro

  pgadmin:
    ports:
      - '127.0.0.1:${PGADMIN_PORT:-8080}:80'
